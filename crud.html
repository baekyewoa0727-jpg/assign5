<!--영화 관리 프로그램-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crud-movie</title>
</head>

<body>
    <h1>영화 관리 프로그램</h1>

    <form id="movie">
        <p>영화 제목</p>
        <input type="text" id="title">

        <p>감독</p>
        <input type="text" id="director">

        <p>개봉 날짜</p>
        <input type="date" id="date">

        <p>별점</p>
        <input type="radio" name="rating" value="1"> 1점
        <input type="radio" name="rating" value="2"> 2점
        <input type="radio" name="rating" value="3"> 3점
        <input type="radio" name="rating" value="4"> 4점
        <input type="radio" name="rating" value="5"> 5점

        <p>후기</p>
        <input type="text" id="review">
    </form>
<h2>영화 목록</h2>
<div id="list"></div>

<script>
    let movie = [
    {
        id: 1,
        title: "오디세이",
        director: "Christopher Nolan",
        date: "2026-07-17",
        rating: 5,
        review: "재밌었다"
    },
    {
        id: 2,
        title: "치이카와 인어섬의 비밀",
        director: "오이카와 케이",
        date: "2026-07-24",
        rating: 3,
        review: "감동적이다"
    },
    {
        id: 3,
        title: "토이 스토리 5",
        director: "Andrew Stanton",
        date: "2026-06-19",
        rating: 2,
        review: "지루하다"
    }
];

function render(){
    list.innerHTML ="";
    movie.forEach(function(item){
        const p = document.createElement("p");

        p.innerText = item.title+"/"+item.director;
        list.appendChild(p);
    });

}
render();
</script>

</body>
</html>
