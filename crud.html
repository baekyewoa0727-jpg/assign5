<!--영화 관리 프로그램-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crud-movie</title>
    <link rel="stylesheet" href="my.css">
</head>

<body>
    <h1>영화 관리 프로그램</h1>

    <form id="movie">
        <p>영화 제목</p>
        <input type="text" id="title" required>

        <p>감독</p>
        <input type="text" id="director" required>

        <p>개봉 날짜</p>
        <input type="date" id="date" required>

        <p>별점</p>
        <input type="radio" name="rating" value="1" required> 1점
        <input type="radio" name="rating" value="2"> 2점
        <input type="radio" name="rating" value="3"> 3점
        <input type="radio" name="rating" value="4"> 4점
        <input type="radio" name="rating" value="5"> 5점

        <p>후기</p>
        <input type="text" id="review" required>
        <button type="submit">저장하기</button>
    </form>


    <h2>영화 목록</h2>
    <div id="list"></div>

    <script>
        let movie = [
            {
                id: 1,
                title: "오디세이",
                director: "Christopher Nolan",
                date: "2026-07-17",
                rating: 5,
                review: "재밌었다"
            },
            {
                id: 2,
                title: "치이카와 인어섬의 비밀",
                director: "오이카와 케이",
                date: "2026-07-24",
                rating: 3,
                review: "감동적이다"
            },
            {
                id: 3,
                title: "토이 스토리 5",
                director: "Andrew Stanton",
                date: "2026-06-19",
                rating: 2,
                review: "지루하다"
            }
        ];
        let editMovie = null;

        function render() {
            list.innerHTML = "";
            movie.forEach(function (item, index) {
                const p = document.createElement("p");

                p.innerText = item.title + " - " + item.director;

                const editBTN = document.createElement("button");
                editBTN.innerText = "수정하기";

                editBTN.addEventListener("click", function () {
                editMovie = item;
                    document.querySelector("#title").value = item.title;
                    document.querySelector("#director").value = item.director;
                    document.querySelector("#date").value = item.date;
                    document.querySelector("#review").value = item.review;
                    document.querySelector('input[name="rating"][value="' + item.rating + '"]').checked = true;
                });
                p.appendChild(editBTN);




                const deleteBTN = document.createElement("button");
                deleteBTN.innerText = "삭제하기";
                deleteBTN.addEventListener("click",function(){
                    if (confirm("정말 삭제하시겠습니까?")) {
                        movie.splice(index, 1);
                        render();
                    }
                });


p.appendChild(deleteBTN);

                list.appendChild(p);
            });

        }
        render();

        document.querySelector("#movie").addEventListener("submit", function(event) {
            event.preventDefault();
            create();
        });


function create() {
    const title = document.querySelector("#title").value;
    const director = document.querySelector("#director").value;
    const date = document.querySelector("#date").value;
    const rating = document.querySelector('input[name="rating"]:checked').value;
    const review = document.querySelector("#review").value;

    const newMovie = {
        title: title,
        director: director,
        date: date,
        rating: rating,
        review: review
    };

    if (editMovie == null) {
        movie.push(newMovie);
    } else {
        editMovie.title = title;
        editMovie.director = director;
        editMovie.date = date;
        editMovie.rating = rating;
        editMovie.review = review;
    }

    editMovie = null;
render();
}

    </script>

</body>

</html>
