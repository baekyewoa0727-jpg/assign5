<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>리스트</h1>

    <input type="text" id="input" placeholder="과일을 입력하세요" required>
    <button id="add">추가하기</button>
    <ul id="list"></ul>

    <script>
        const input = document.querySelector("#input");
        const addBtn = document.querySelector("#add");
        const list = document.querySelector("#list");

        //addBtn.addEventListener("click", function () {
        //값을 저장하는 코드 - split 안되는 버전 const value = input.value.trim();

        addBtn.addEventListener("click", function () {
            const fruits = input.value.split(",");

            if (input.value == "") {
                alert("빈칸을 채우세요");
                return;
            }

            //헷갈린 부분

            fruits.forEach(function (fruit) {


            const li = document.createElement("li");
            li.innerText=fruit;

            const deleteBtn = document.createElement("button");
            deleteBtn.innerText="삭제";

            li.appendChild(deleteBtn);
            list.appendChild(li);

            deleteBtn.addEventListener("click", function () {
                li.remove();
            });
        });
    });

    input.addEventListener("keydown",function(event){
        if (event.key =="Enter"){
            addBtn.click();
        }
    });
    //더하는 기능이 있는 함수를 만들고 재사용하는게 아니라 addBtn의 상태를 클릭 이벤트가 발생된것처럼 만들어서 click과정을 실행하는 방법을 사용. 


        //쉼표로 과일 seperate하는 기능,

    </script>
</body>

</html>
